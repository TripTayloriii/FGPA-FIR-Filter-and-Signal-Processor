# Vitis HLS 2025.2 config for fir595. Regenerate the RTL with:
#   cd HLS; v++ -c --mode hls --config hls_config.cfg --work_dir <build dir>
# then copy <build dir>/hls/syn/verilog/*.v into rtl/.
part=xc7s25-csga324-1

[hls]
flow_target=vivado
clock=10ns
syn.top=fir595
syn.file=fir595.cpp
syn.file=fir595.h
# reset the static delay line on ap_rst too (default only resets the FSM)
syn.rtl.reset=all
